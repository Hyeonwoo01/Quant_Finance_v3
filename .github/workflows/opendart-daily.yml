name: opendart-daily

# 매일 06:17 KST(전날 21:17 UTC)에 OpenDART 공시 목록·재무제표를 받아 data 브랜치에 쌓는다.
# 한국 장 시작 전 의사결정 컷오프(08:30 KST) 전에 끝나도록 일찍 돈다. 예약 실행은 기본 브랜치(main)의 이 파일로만 돈다.
# 수동 실행(Run workflow): mode=check면 저장 없이 인증키·연결만 확인. lookback_days로 다시 훑을 접수일 범위를 정한다.
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = 수집해서 data 브랜치에 저장, check = 저장 없이 인증키·연결만 확인"
        type: choice
        options: [collect, check]
        default: collect
      lookback_days:
        description: "어제부터 거꾸로 며칠 치 접수일을 훑을지 (1~60)"
        default: "7"

permissions:
  contents: write

concurrency:
  group: opendart-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'collect' }}
      LOOKBACK: ${{ inputs.lookback_days || '7' }}
    steps:
      - uses: actions/checkout@v4
      - name: data 브랜치 가져오기
        if: env.MODE == 'collect'
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집
        id: collect
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          case "$LOOKBACK" in ''|*[!0-9]*) echo "lookback_days는 숫자여야 함"; exit 2;; esac
          if [ "$LOOKBACK" -lt 1 ] || [ "$LOOKBACK" -gt 60 ]; then echo "lookback_days는 1~60"; exit 2; fi
          if [ "$MODE" = "check" ]; then
            python -m orchestration.opendart_daily --check
          else
            python -m orchestration.opendart_daily --data-dir data --lookback-days "$LOOKBACK"
          fi
      - name: data 브랜치에 저장 (실패해도 받은 만큼과 수집 기록은 남김)
        if: always() && env.MODE == 'collect'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "OpenDART 수집 $(date -u +%Y-%m-%dT%H:%MZ) (${{ steps.collect.outcome }})"
          git push origin HEAD:data
      - name: 수집 실패 표시
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 단계가 실패했습니다. 위 '수집' 로그와 data 브랜치 manifests/를 확인하세요."
          exit 1
