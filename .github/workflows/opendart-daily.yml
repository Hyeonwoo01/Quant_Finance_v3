name: opendart-daily

# 매일 06:17 KST(전날 21:17 UTC)에 OpenDART 공시 목록·재무제표를 받아 data 브랜치에 쌓는다.
# 한국 장 시작 전 의사결정 컷오프(08:30 KST) 전에 끝나도록 일찍 돈다. 예약 실행은 기본 브랜치(main)의 이 파일로만 돈다.
# 수동 실행(Run workflow): mode=check면 저장 없이 인증키·연결만 확인. lookback_days로 다시 훑을 접수일 범위를 정한다.
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = 수집해서 data 브랜치에 저장, check = 저장 없이 인증키·연결만 확인, probe-xbrl = 대형주 XBRL 구조 점검(저장 없음), history = 2015~ 과거 재무 채우기, history-values = 빠짐없이 끝난 목록 저장본으로 값만 다시 받기"
        type: choice
        options: [collect, check, probe-xbrl, probe-multi, history, history-values]
        default: collect
      lookback_days:
        description: "어제부터 거꾸로 며칠 치 접수일을 훑을지 (1~60)"
        default: "7"

permissions:
  contents: write

concurrency:
  group: data-branch          # 같은 data 브랜치에 커밋하는 macro-daily와 동시에 돌지 않게
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # history(과거 재무 채우기)는 목록 훑기만 2시간 가까이 걸린다
    timeout-minutes: ${{ startsWith(inputs.mode, 'history') && 330 || 120 }}
    env:
      PYTHONUNBUFFERED: "1"          # 로그가 실행 중에도 바로 보이게
      MODE: ${{ inputs.mode || 'collect' }}
      LOOKBACK: ${{ inputs.lookback_days || '7' }}
    steps:
      - uses: actions/checkout@v4
      - name: data 브랜치 가져오기
        if: env.MODE == 'collect' || startsWith(env.MODE, 'history')
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집
        id: collect
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          case "$LOOKBACK" in ''|*[!0-9]*) echo "lookback_days는 숫자여야 함"; exit 2;; esac
          if [ "$LOOKBACK" -lt 1 ] || [ "$LOOKBACK" -gt 60 ]; then echo "lookback_days는 1~60"; exit 2; fi
          if [ "$MODE" = "check" ]; then
            python -m orchestration.opendart_daily --check
          elif [ "$MODE" = "history" ]; then
            python -m orchestration.dart_history --data-dir data
          elif [ "$MODE" = "history-values" ]; then
            python -m orchestration.dart_history --data-dir data --from-index
          elif [ "$MODE" = "probe-multi" ]; then
            python -m orchestration.opendart_daily --probe-multi
          elif [ "$MODE" = "probe-xbrl" ]; then
            python -m collectors.opendart_xbrl
          else
            python -m orchestration.opendart_daily --data-dir data --lookback-days "$LOOKBACK"
          fi
      - name: data 브랜치에 저장 (실패해도 받은 만큼과 수집 기록은 남김)
        if: always() && (env.MODE == 'collect' || startsWith(env.MODE, 'history'))
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "OpenDART 수집 $(date -u +%Y-%m-%dT%H:%MZ) (${{ steps.collect.outcome }})"
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git pull --rebase origin data
          done
          exit 1
      - name: 수집 실패 표시
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 단계가 실패했습니다. 위 '수집' 로그와 data 브랜치 manifests/를 확인하세요."
          exit 1
