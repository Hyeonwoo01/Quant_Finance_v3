name: opendart-daily

# OpenDART 공시 목록·재무제표를 받아 data 브랜치에 쌓는다. 하루 세 번 예약한다:
#   19:37 KST(10:37 UTC) · 00:47 KST(15:47 UTC) · 06:17 KST(21:17 UTC)
# GitHub 예약 실행은 부하가 많으면 몇 시간씩 늦게 시작한다 (2026-11 관측: 06:17 예약이 10~13시에 시작). 한 번이라도
# 08:30 KST 판단 전에 끝나도록 시각을 나눴다. 수집은 최근 며칠을 다시 훑고 중복은 건너뛰므로 여러 번 돌아도 같은 결과이고,
# 하루 호출 수는 state/opendart_calls.json으로 모든 실행을 합쳐 제한한다.
# 수동 실행(Run workflow): mode=check면 저장 없이 인증키·연결만 확인. lookback_days로 다시 훑을 접수일 범위를 정한다.
on:
  schedule:
    - cron: "37 10 * * *"
    - cron: "47 15 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = 수집해서 data 브랜치에 저장, check = 저장 없이 인증키·연결만 확인, probe-xbrl = 대형주 XBRL 구조 점검(저장 없음), history = 2015~ 과거 재무 채우기, history-values = 빠짐없이 끝난 목록 저장본으로 아직 없는 값만 받기, history-unlisted = 저장된 목록 원본에서 종목코드 없는 회사까지 목록을 다시 만들고 그 값을 받기"
        type: choice
        options: [collect, check, probe-xbrl, probe-multi, history, history-values, history-unlisted]
        default: collect
      lookback_days:
        description: "어제부터 거꾸로 며칠 치 접수일을 훑을지 (1~60)"
        default: "7"

permissions:
  contents: write

concurrency:
  group: data-branch          # 같은 data 브랜치에 커밋하는 macro-daily와 동시에 돌지 않게
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # history(과거 재무 채우기)는 목록 훑기만 2시간 가까이 걸린다
    timeout-minutes: ${{ startsWith(inputs.mode, 'history') && 330 || 120 }}
    env:
      PYTHONUNBUFFERED: "1"          # 로그가 실행 중에도 바로 보이게
      MODE: ${{ inputs.mode || 'collect' }}
      LOOKBACK: ${{ inputs.lookback_days || '7' }}
    steps:
      - uses: actions/checkout@v5
      - name: data 브랜치 가져오기
        if: env.MODE == 'collect' || startsWith(env.MODE, 'history')
        uses: actions/checkout@v5
        with:
          ref: data
          path: data
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집
        id: collect
        continue-on-error: true
        # 평소 일일 수집은 2~22분. 멈추면(2026-11-14·17) 다음 단계(받은 만큼 저장)가 돌 시간을 남기고 끊는다
        timeout-minutes: ${{ startsWith(inputs.mode, 'history') && 320 || 60 }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          case "$LOOKBACK" in ''|*[!0-9]*) echo "lookback_days는 숫자여야 함"; exit 2;; esac
          if [ "$LOOKBACK" -lt 1 ] || [ "$LOOKBACK" -gt 60 ]; then echo "lookback_days는 1~60"; exit 2; fi
          if [ "$MODE" = "check" ]; then
            python -m orchestration.opendart_daily --check
          elif [ "$MODE" = "history" ]; then
            python -m orchestration.dart_history --data-dir data
          elif [ "$MODE" = "history-values" ]; then
            python -m orchestration.dart_history --data-dir data --from-index --only-missing
          elif [ "$MODE" = "history-unlisted" ]; then
            python -m orchestration.dart_history --data-dir data --reindex-raw --from-index --only-missing
          elif [ "$MODE" = "probe-multi" ]; then
            python -m orchestration.opendart_daily --probe-multi
          elif [ "$MODE" = "probe-xbrl" ]; then
            python -m collectors.opendart_xbrl
          else
            python -m orchestration.opendart_daily --data-dir data --lookback-days "$LOOKBACK"
          fi
      - name: data 브랜치에 저장 (실패해도 받은 만큼과 수집 기록은 남김)
        if: always() && (env.MODE == 'collect' || startsWith(env.MODE, 'history'))
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "OpenDART 수집 $(date -u +%Y-%m-%dT%H:%MZ) (${{ steps.collect.outcome }})"
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git pull --rebase origin data
          done
          exit 1
      - name: 수집 실패 표시
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 단계가 실패했습니다. 위 '수집' 로그와 data 브랜치 manifests/를 확인하세요."
          exit 1
